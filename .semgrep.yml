# Semgrep SAST rules for leads-db.
# Run locally:   semgrep --config=.semgrep.yml
# Run in CI:     runs on every push/PR to main (see ci.yml)
#
# Rules are organized by severity and domain. ERROR rules block CI;
# WARNING rules surface issues for review without failing the build.
#
# ────────────────────────────────────────────────────────────────────
# WHAT SEMGREP CANNOT DO (covered by other CI jobs in ci.yml):
# ────────────────────────────────────────────────────────────────────
#
# 1. IOC (Indicators of Compromise) patterns — semgrep's pattern engine
#    cannot express obfuscation patterns like eval("global.o=", atob(),
#    long config lines >1200 chars, etc. These are handled by
#    scripts/scan-source-iocs.sh (bash + ripgrep). Job: `ci-ioc`.
#
# 2. PII / secret regex scanning — semgrep's metavariable engine is
#    unreliable for catching API keys, tokens, SSNs, phone numbers,
#    email addresses embedded in prose. These are handled by
#    scripts/silver-gate-repo.mjs + scripts/silver-gate-patterns.json.
#    Job: `ci-silver-gate`.
#
# 3. Whitespace / trojan-source attacks — trailing whitespace injection,
#    zero-width Unicode characters, confusable homoglyphs. semgrep can't
#    scan for these efficiently across all files. Handled by
#    scripts/guard-whitespace.sh. Job: `ci-whitespace`.
#
# 4. Dependency vulnerabilities — handled by pip-audit and pnpm audit.
#    Job: `audit` (shared with root CI).
#
# 5. Gitleaks — Git-history secret scanning. Job: `secrets` (shared).
#
# Rule philosophy (evolved from production incidents in this monorepo):
#   - BYOK secrets must never be hardcoded or stored in plaintext
#   - All SQL must use parameterized queries (no string interpolation)
#   - Python processors must never fall back to localhost/Ollama defaults
#   - No env-var-based inference/tuning config — everything goes through the
#     settings table
#   - No dead V1 code, stale imports, or leftover CLI entry points
#   - PII must be masked by default in output paths

rules:
  # ──────────────────────────────────────────────
  # ERROR: secrets & credentials (blocking)
  # ──────────────────────────────────────────────

  - id: no-hardcoded-secrets-ts
    languages: [ts, js, typescript, javascript]
    severity: ERROR
    message: >-
      Hardcoded credential or secret found. Use environment variables
      instead (imported via process.env).
    patterns:
      - pattern-either:
          - pattern: |
              $KEY = "..."
          - pattern: |
              const $KEY = "..."
          - pattern: |
              let $KEY = "..."
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i).*(api.?key|secret|password|token|credential).*
      - pattern-not-regex: process\.env\.\w+
    fix: process.env.YOUR_VAR_NAME

  - id: no-hardcoded-secrets-py
    languages: [python]
    severity: ERROR
    message: >-
      Hardcoded credential or secret found. Use environment variables
      (os.environ.get("VAR")) or the settings table instead.
    patterns:
      - pattern-either:
          - pattern: |
              $KEY = "..."
          - pattern: |
              $KEY = '...'
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i).*(api.?key|secret|password|token|credential).*
      - pattern-not-regex: os\.environ\.(get|getenv|__getitem__)\(
    fix: os.environ.get("YOUR_VAR_NAME", "")

  - id: no-baked-in-llm-endpoint
    languages: [python]
    severity: ERROR
    message: >-
      Hardcoded LLM endpoint found. LeadsDB is BYOK — never bake in a default
      host, model name, or provider URL. Endpoints come from the settings table
      (scorer_api_url / scorer_model) and ship empty by default.
    patterns:
      - pattern-either:
          - pattern-regex: https?://(api\.openai\.com|api\.deepinfra\.com|localhost)[^"'\s]*
          - pattern-regex: "(llama|gpt-5|gpt|deepseek|mixtral|claude)"
      - pattern-not-regex: (scorer_api_url|scorer_model|example\.com)

  - id: no-env-var-for-inference-config
    languages: [python]
    severity: ERROR
    message: >-
      Inference/tuning config read from an environment variable. The product
      contract is that ONLY LDB_DATABASE_URL, LDB_SETTINGS_ENCRYPTION_KEY, and
      LEADSDB_ADMIN_TOKEN exist as env vars. Everything else — endpoints,
      model names, thresholds, batch sizes, workspace selectors — lives in the
      settings table, read each processor cycle.
    patterns:
      - pattern: os.environ["$VAR"]
      - pattern: os.environ.get("$VAR")
      - pattern: os.getenv("$VAR")
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i).*(api_url|endpoint|model|threshold|batch|concurrency|timeout|api_key|secret|resend|transport|workspace|interval).*
      - pattern-not-regex: LDB_DATABASE_URL|LDB_SETTINGS_ENCRYPTION_KEY|LEADSDB_ADMIN_TOKEN

  # ──────────────────────────────────────────────
  # ERROR: SQL injection (blocking)
  # ──────────────────────────────────────────────

  - id: sql-injection-raw-query-ts
    languages: [ts, js, typescript, javascript]
    severity: ERROR
    message: >-
      Raw SQL query with string interpolation detected.
      Use parameterized queries via pg's $1, $2 placeholders.
    patterns:
      - pattern-either:
          - pattern: pool.query(`...${...}...`)
          - pattern: client.query(`...${...}...`)
          - pattern: pool.query("..." + $VAR + "...")
          - pattern: client.query("..." + $VAR + "...")

  - id: sql-injection-raw-query-py
    languages: [python]
    severity: ERROR
    message: >-
      SQL query built with string formatting or concatenation.
      Use parameterized queries (%%s or %(name)s placeholders
      with psycopg) to prevent injection.
    patterns:
      - pattern-either:
          - pattern: |
              f"...{...}..."
          - pattern: |
              "..." + $VAR + "..."
      - pattern-inside: |
          cur.execute(...)
      - pattern-not-regex: cur\.execute\([^)]*%\(

  # ──────────────────────────────────────────────
  # ERROR: dangerous patterns (blocking)
  # ──────────────────────────────────────────────

  - id: no-eval
    languages: [ts, js, typescript, javascript, python]
    severity: ERROR
    message: >-
      eval() is a security risk. Use a safe alternative.
    patterns:
      - pattern: eval(...)

  - id: py-unsafe-yaml-load
    languages: [python]
    severity: ERROR
    message: >-
      Using yaml.load() without a safe Loader can lead to
      arbitrary code execution. Use yaml.safe_load() instead.
    patterns:
      - pattern: yaml.load(...)
      - pattern-not: yaml.load(..., Loader=yaml.SafeLoader)

  - id: py-pickle-unsafe
    languages: [python]
    severity: ERROR
    message: >-
      pickle.load/loads can execute arbitrary code during
      deserialization. Prefer JSON or a safe serialization format.
    patterns:
      - pattern: pickle.load(...)
      - pattern: pickle.loads(...)

  # ──────────────────────────────────────────────
  # ERROR: project-specific anti-patterns (blocking)
  # ──────────────────────────────────────────────

  - id: no-resend-env-var
    languages: [python]
    severity: ERROR
    message: >-
      RESEND_API_KEY env var detected. Resend is a transport adapter chosen
      via the outreach_transport setting, not an env var. The transport's API
      key lives in the settings table (outreach_api_key), encrypted at rest.
    patterns:
      - pattern-either:
          - pattern: os.environ["RESEND_API_KEY"]
          - pattern: os.environ.get("RESEND_API_KEY")
          - pattern: os.getenv("RESEND_API_KEY")

  - id: no-plaintext-secret-in-db
    languages: [python, ts]
    severity: ERROR
    message: >-
      Secret value being stored directly in the database without encryption.
      BYOK API keys and other secrets must be AES-256-GCM encrypted via
      crypto.encrypt() / leadsdb_engine.crypto.encrypt() before touching the
      settings table. Use set_secret() / setSetting() helpers that handle
      encryption transparently.
    patterns:
      - pattern-either:
          - pattern: |
              INSERT INTO settings ... $VAL ...
          - pattern: |
              UPDATE settings SET ... = $VAL ...
      - metavariable-regex:
          metavariable: $VAL
          regex: (?i).*(api_key|secret|password|token).*
      - pattern-not-inside: |
          crypto.encrypt(...)
      - pattern-not-inside: |
          encrypt(...)

  - id: no-dead-cli-entry-point
    languages: [python]
    severity: ERROR
    message: >-
      V1-style CLI entry point detected in pyproject.toml [project.scripts].
      The `leadsdb-settings` CLI was removed in the V2 rewrite — settings
      writes happen from the Next.js API route, not Python. If you're adding
      a new CLI entry point, confirm with the product direction first.
    patterns:
      - pattern: |
          leadsdb-settings = "..."
      - pattern-inside: |
          [project.scripts]

  # ──────────────────────────────────────────────
  # WARNING: reliability & observability
  # ──────────────────────────────────────────────

  - id: no-console-error-without-logger
    languages: [ts, js, typescript, javascript]
    severity: WARNING
    message: >-
      console.error() found. Consider using a structured logger
      instead so errors are captured in production observability.
    pattern: console.error(...)

  - id: py-request-without-timeout
    languages: [python]
    severity: WARNING
    message: >-
      HTTP request without an explicit timeout. Long-running or
      hanging requests can block workers. Add timeout=... or
      use httpx with a configured timeout client.
    patterns:
      - pattern-either:
          - pattern: requests.get(...)
          - pattern: requests.post(...)
          - pattern: httpx.get(...)
          - pattern: httpx.post(...)
      - pattern-not-inside: |
          timeout=$_VALUE
      - pattern-not-inside: |
          httpx.AsyncClient(timeout=...)

  - id: py-subprocess-with-shell
    languages: [python]
    severity: WARNING
    message: >-
      subprocess with shell=True is a command-injection risk.
      Pass arguments as a list or use shlex.split().
    patterns:
      - pattern: subprocess.call(..., shell=True, ...)
      - pattern: subprocess.Popen(..., shell=True, ...)
      - pattern: os.system(...)
      - pattern: os.popen(...)

  # ──────────────────────────────────────────────
  # WARNING: generic security hygiene
  # ──────────────────────────────────────────────

  - id: generic-insecure-random
    languages: [generic]
    severity: WARNING
    message: >-
      Use of a predictable random generator. Use secrets.token_*
      (Python) or crypto.randomBytes (Node.js) for security-sensitive
      randomness.
    patterns:
      - pattern-either:
          - pattern: random.random()
          - pattern: Math.random()
      - pattern-not-inside: |
          # Non-security usage
