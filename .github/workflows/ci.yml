name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install pnpm deps
        run: pnpm install --frozen-lockfile

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install just
        uses: extractions/setup-just@v2

      - name: CI check (syntax + types + shell)
        run: just ci-check

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install pnpm deps
        run: pnpm install --frozen-lockfile

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install just
        uses: extractions/setup-just@v2

      - name: ruff (Python lint)
        run: just ci-ruff

      - name: bandit (Python security)
        run: just ci-bandit

      - name: shellcheck
        run: |
          shellcheck scripts/*.sh 2>/dev/null || echo "shellcheck warnings found"

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install Python deps
        run: cd engine && uv sync --group dev

      - name: Run Python tests
        run: just ci-engine-test

      - name: Upload Python test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-results
          path: engine/test-results.xml

  test-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install pnpm deps
        run: pnpm install --frozen-lockfile

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Run TypeScript tests
        run: just ci-js-test

      - name: Upload JS test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: js-test-results
          path: test-results-js.xml

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Run Semgrep SAST
        uses: semgrep/semgrep-action@v1
        with:
          config: .semgrep.yml
        env:
          SEMGREP_TIMEOUT: 120
