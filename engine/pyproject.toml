[project]
name = "leadsdb-engine"
version = "0.1.0"
description = "LeadsDB V2"
requires-python = ">=3.12"
dependencies = [
    "websocket-client>=1.8",
    "psycopg[binary]>=3.2",
    "httpx>=0.28",
    "dnspython>=2.7",
    "beautifulsoup4>=4.12",
    "lxml>=5.1",
    "python-dateutil>=2.9",
    "pydantic>=2.0",
    "structlog>=24.0",
    "cryptography>=42.0",
    "sentry-sdk>=2.68.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "ruff>=0.6",
    "bandit>=1.7",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG"]
ignore = ["E501"]

[tool.bandit]
targets = ["leadsdb_engine/"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = [".."]

[project.scripts]
leadsdb-ingest = "leadsdb_engine.processors.certstream_ingestor:main"
leadsdb-enrich = "leadsdb_engine.processors.domain_enricher:main"
leadsdb-score = "leadsdb_engine.processors.entity_scorer:main"
leadsdb-promote = "leadsdb_engine.processors.lead_promoter:main"
leadsdb-outreach = "leadsdb_engine.processors.sequence_dispatcher:main"
leadsdb-crm = "leadsdb_engine.crm:main"
